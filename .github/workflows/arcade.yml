name: arcade

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/arcade.yml"]

permissions:
  contents: write

concurrency:
  group: arcade
  cancel-in-progress: false

jobs:
  city-3d:
    name: 3D contribution city
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib
          if git commit -m "chore: refresh 3d contribution city"; then
            git pull --rebase && git push
          fi

  games:
    name: snake + pacman + breakout
    runs-on: ubuntu-latest
    steps:
      - uses: abozanona/pacman-contribution-graph@v5.0.0
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout"
      - uses: Platane/snk@v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ffa3&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/snake-neon.svg?palette=github-dark&color_snake=#ff2e88&color_dots=#151126,#2a1a5e,#4b2bb8,#7c5cff,#b48cff
      - name: Fix dist ownership (snk runs in docker as root)
        run: sudo chown -R "$(id -u):$(id -g)" dist
      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
