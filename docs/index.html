<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Commit Runner — Shoaeb's Arcade</title>
<meta name="description" content="Dodge bugs, collect commits, ship to prod. A tiny synthwave arcade game by Shoaeb Malik.">
<meta property="og:title" content="Commit Runner — Shoaeb's Arcade">
<meta property="og:description" content="Dodge bugs, collect commits, ship to prod.">
<meta name="theme-color" content="#07050f">
<style>
  :root{--bg:#07050f;--mint:#00ffa3;--cyan:#7cf3ff;--pink:#ff2e88;--violet:#7c5cff;--text:#e9e4ff;--dim:#8b84a8}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
  canvas{display:block;width:100vw;height:100vh;height:100dvh}
  .hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:16px 18px;pointer-events:none;font-size:14px;letter-spacing:.08em}
  .hud b{display:block;font-size:26px;color:var(--mint);text-shadow:0 0 12px var(--mint)}
  .hud .r{text-align:right}.hud .r b{color:var(--cyan);text-shadow:0 0 12px var(--cyan)}
  .lives{color:var(--pink);font-size:18px;letter-spacing:.2em}
  .screen{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:radial-gradient(ellipse at center,rgba(7,5,15,.55),rgba(7,5,15,.9))}
  .screen[hidden]{display:none}
  h1{font-size:clamp(34px,8vw,76px);letter-spacing:.06em;background:linear-gradient(90deg,var(--mint),var(--cyan),#b48cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(0,255,163,.45))}
  .tag{color:var(--dim);margin:10px 0 26px;font-size:clamp(13px,2.4vw,16px)}
  .keys{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;color:var(--dim);font-size:13px;margin-top:22px}
  kbd{border:1px solid #3a3358;border-bottom-width:3px;border-radius:6px;padding:2px 8px;color:var(--text);background:#151126}
  button{font:inherit;font-size:18px;letter-spacing:.12em;color:var(--bg);background:var(--mint);border:0;border-radius:12px;padding:14px 30px;cursor:pointer;box-shadow:0 0 24px rgba(0,255,163,.5);transition:transform .15s}
  button:hover{transform:translateY(-2px)}button:focus-visible{outline:3px solid var(--cyan);outline-offset:4px}
  .final{font-size:clamp(18px,3vw,24px);margin:6px 0 4px}.final b{color:var(--mint)}
  .back{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim)}
  .back a{color:var(--cyan)}
  body.playing .back{display:none}
</style>
</head>
<body>
<canvas id="c" aria-label="Commit Runner game canvas"></canvas>
<div class="hud" aria-live="polite">
  <div>COMMITS<b id="score">0</b><span class="lives" id="lives">♥♥♥</span></div>
  <div class="r">BEST<b id="best">0</b><span id="lvl">v0.1.0</span></div>
</div>

<div class="screen" id="start">
  <div>
    <h1>COMMIT RUNNER</h1>
    <p class="tag">dodge the 🐛 bugs · grab the <span style="color:var(--mint)">■</span> commits · ship to prod</p>
    <button id="play">▶ PRESS START</button>
    <div class="keys"><span><kbd>←</kbd> <kbd>→</kbd> / <kbd>A</kbd> <kbd>D</kbd> switch lanes</span><span>📱 tap left / right</span><span><kbd>P</kbd> pause</span></div>
  </div>
</div>

<div class="screen" id="over" hidden>
  <div>
    <h1>BUILD FAILED</h1>
    <p class="final">you pushed <b id="fscore">0</b> commits · <span id="frel">v0.1.0</span></p>
    <p class="tag" id="quip"></p>
    <button id="again">↻ git commit --amend</button>
  </div>
</div>
<p class="back">made with ☕ by <a href="https://github.com/ShoaebMalik19">@ShoaebMalik19</a></p>

<script>
(() => {
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const $ = (id) => document.getElementById(id);
  let W, H, DPR, HOR;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight; HOR = H * 0.42;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize); resize();

  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } },
                  set(k, v) { try { localStorage.setItem(k, v); } catch {} } };
  let best = +store.get("commit-runner-best") || 0; $("best").textContent = best;

  const LANES = [-1, 0, 1], FAR = 60;
  let state = "menu", player, objs, score, lives, speed, spawnT, t, shake, particles, laneVis, inv;

  function reset() {
    player = 1; laneVis = 1; objs = []; particles = []; score = 0; lives = 3;
    speed = 18; spawnT = 0; t = 0; shake = 0; inv = 0; updHud();
  }
  // project world (x in lanes, z depth ahead) to screen
  function proj(x, z) {
    const s = 1 / (1 + z * 0.12);
    return { x: W / 2 + x * W * 0.28 * s, y: HOR + (H - HOR) * s * 0.86, s };
  }
  const version = () => `v${Math.floor(score / 50)}.${Math.floor(score / 10) % 5}.${score % 10}`;
  function updHud() {
    $("score").textContent = score; $("lives").textContent = "♥".repeat(Math.max(lives, 0)) + "♡".repeat(3 - Math.max(lives, 0));
    $("lvl").textContent = version();
  }

  function spawn() {
    const lane = LANES[Math.floor(Math.random() * 3)];
    const bug = Math.random() < 0.55 + Math.min(score / 400, 0.2);
    objs.push({ x: lane, z: FAR, kind: bug ? "bug" : "commit", spin: Math.random() * 6 });
    if (bug && score > 15 && Math.random() < 0.3) { // double-bug wave
      const other = LANES.filter((l) => l !== lane)[Math.floor(Math.random() * 2)];
      objs.push({ x: other, z: FAR + 4, kind: "bug", spin: 0 });
    }
  }
  function burst(x, y, color, n = 18) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, v = 2 + Math.random() * 5;
      particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, life: 1, color });
    }
  }

  // ---- drawing ----
  const stars = Array.from({ length: 120 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + .2, p: Math.random() * 6 }));
  // wireframe icosahedron floating in the sky
  const G = (1 + Math.sqrt(5)) / 2;
  const IV = [[-1,G,0],[1,G,0],[-1,-G,0],[1,-G,0],[0,-1,G],[0,1,G],[0,-1,-G],[0,1,-G],[G,0,-1],[G,0,1],[-G,0,-1],[-G,0,1]];
  const IE = []; IV.forEach((a, i) => IV.forEach((b, j) => { if (j > i && Math.abs(Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]) - 2) < 1e-6) IE.push([i, j]); }));

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, HOR);
    g.addColorStop(0, "#05040d"); g.addColorStop(.75, "#140a2e"); g.addColorStop(1, "#3a0f4f");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, HOR);
    for (const s of stars) { ctx.globalAlpha = .3 + .7 * Math.abs(Math.sin(t * .8 + s.p)); ctx.fillStyle = "#fff"; ctx.fillRect(s.x * W, s.y * HOR * .9, s.r, s.r); }
    ctx.globalAlpha = 1;
    // sun
    const R = Math.min(W, H) * 0.16, cx = W / 2;
    ctx.save(); ctx.beginPath(); ctx.arc(cx, HOR, R, Math.PI, 0); ctx.clip();
    const sg = ctx.createLinearGradient(0, HOR - R, 0, HOR); sg.addColorStop(0, "#ffd23f"); sg.addColorStop(.6, "#ff2e88"); sg.addColorStop(1, "#7c5cff");
    ctx.fillStyle = sg; ctx.fillRect(cx - R, HOR - R, R * 2, R);
    ctx.fillStyle = "#140a2e";
    for (let i = 0; i < 7; i++) { const yy = HOR - R * .55 + i * R * .08 + ((t * 8) % (R * .08)); ctx.fillRect(cx - R, yy, R * 2, 1 + i * .9); }
    ctx.restore();
    // icosahedron
    const a = t * .5, b = .4 + Math.sin(t * .3) * .3, ix = W * .82, iy = HOR * .42, isz = Math.min(W, H) * .06;
    const P = IV.map(([x, y, z]) => { [x, z] = [x * Math.cos(a) - z * Math.sin(a), x * Math.sin(a) + z * Math.cos(a)]; [y, z] = [y * Math.cos(b) - z * Math.sin(b), y * Math.sin(b) + z * Math.cos(b)]; const f = 6 / (6 + z); return [ix + x * isz * f, iy + y * isz * f]; });
    ctx.strokeStyle = "#7cf3ff"; ctx.lineWidth = 1.3; ctx.shadowColor = "#7cf3ff"; ctx.shadowBlur = 10;
    ctx.beginPath(); for (const [i, j] of IE) { ctx.moveTo(P[i][0], P[i][1]); ctx.lineTo(P[j][0], P[j][1]); } ctx.stroke(); ctx.shadowBlur = 0;
  }
  function drawFloor() {
    ctx.fillStyle = "#07050f"; ctx.fillRect(0, HOR, W, H - HOR);
    ctx.strokeStyle = "rgba(255,46,136,.6)"; ctx.lineWidth = 1.2;
    for (let i = -14; i <= 14; i++) { const a = proj(i * .5 - .25, 600), b = proj(i * .5 - .25, -2); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    const off = (t * speed) % 3;
    for (let z = 240; z > -2; z -= 3) { const p = proj(0, z - off); if (p.y < HOR) continue; ctx.globalAlpha = Math.min(1, (p.y - HOR) / 40); ctx.beginPath(); ctx.moveTo(0, p.y); ctx.lineTo(W, p.y); ctx.stroke(); }
    ctx.globalAlpha = 1;
    // lane rails
    ctx.strokeStyle = "rgba(124,243,255,.35)"; ctx.lineWidth = 2;
    for (const lx of [-1.5, -.5, .5, 1.5]) { const a = proj(lx, 600), b = proj(lx, -2); ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); }
    ctx.strokeStyle = "#ff2e88"; ctx.shadowColor = "#ff2e88"; ctx.shadowBlur = 12; ctx.beginPath(); ctx.moveTo(0, HOR); ctx.lineTo(W, HOR); ctx.stroke(); ctx.shadowBlur = 0;
  }
  function drawObj(o) {
    const p = proj(o.x, o.z), sz = W * .085 * p.s;
    if (o.kind === "commit") {
      ctx.save(); ctx.translate(p.x, p.y - sz * 1.1); ctx.rotate(o.spin + t * 2);
      ctx.fillStyle = "#00ffa3"; ctx.shadowColor = "#00ffa3"; ctx.shadowBlur = 22 * p.s + 4;
      ctx.fillRect(-sz / 2, -sz / 2, sz, sz); ctx.fillStyle = "#07050f"; ctx.fillRect(-sz / 5, -sz / 5, sz / 2.5, sz / 2.5);
      ctx.restore();
    } else {
      ctx.save(); ctx.translate(p.x, p.y - sz * .9);
      ctx.shadowColor = "#ff2e88"; ctx.shadowBlur = 20 * p.s + 4;
      ctx.font = `${sz * 1.5}px serif`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.rotate(Math.sin(t * 10 + o.spin) * .15); ctx.fillText("🐛", 0, 0);
      ctx.restore();
    }
  }
  function drawPlayer() {
    laneVis += (player - laneVis) * .25;
    const p = proj(LANES[0] + laneVis, 0), sz = W * .06;
    if (inv > 0 && Math.floor(inv * 12) % 2) return;
    ctx.save(); ctx.translate(p.x, p.y - sz * .6); ctx.rotate((player - laneVis) * -.35);
    ctx.shadowColor = "#7cf3ff"; ctx.shadowBlur = 24;
    ctx.fillStyle = "#7cf3ff"; ctx.beginPath(); ctx.moveTo(0, -sz * .7); ctx.lineTo(sz * .8, sz * .4); ctx.lineTo(0, sz * .15); ctx.lineTo(-sz * .8, sz * .4); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#ff2e88"; ctx.fillRect(-sz * .25, sz * .3, sz * .5, sz * (.15 + Math.random() * .2));
    ctx.restore();
  }

  // ---- loop ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now; t += dt;
    if (state === "play") {
      speed += dt * .35; inv = Math.max(0, inv - dt);
      spawnT -= dt; if (spawnT <= 0) { spawn(); spawnT = Math.max(.32, 1.05 - score / 160) * (18 / speed) * 1.4; }
      for (const o of objs) o.z -= speed * dt;
      for (const o of objs) {
        if (o.z < .9 && o.z > -.6 && !o.hit && o.x === LANES[player]) {
          o.hit = true; const p = proj(o.x, 0);
          if (o.kind === "commit") { score++; burst(p.x, p.y - 30, "#00ffa3"); }
          else if (inv <= 0) { lives--; shake = .35; inv = 1.2; burst(p.x, p.y - 30, "#ff2e88", 30); if (lives <= 0) end(); }
          updHud();
        }
      }
      objs = objs.filter((o) => o.z > -3 && !(o.hit && o.kind === "commit"));
    }
    ctx.save();
    if (shake > 0) { shake -= dt; ctx.translate((Math.random() - .5) * 18 * shake, (Math.random() - .5) * 18 * shake); }
    drawSky(); drawFloor();
    [...objs].sort((a, b) => b.z - a.z).forEach(drawObj);
    if (state !== "menu") drawPlayer();
    for (const q of particles) { q.x += q.vx; q.y += q.vy; q.vy += .25; q.life -= dt * 1.6; ctx.globalAlpha = Math.max(q.life, 0); ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, 4, 4); }
    particles = particles.filter((q) => q.life > 0); ctx.globalAlpha = 1;
    ctx.restore();
    requestAnimationFrame(frame);
  }

  const quips = ["works on my machine™", "it's not a bug, it's a feature", "have you tried turning it off and on again?", "git blame says it was you", "merge conflict in your soul", "skill issue (respectfully)", "ship it anyway?"];
  function end() {
    state = "over"; document.body.classList.remove("playing");
    if (score > best) { best = score; store.set("commit-runner-best", best); $("best").textContent = best; }
    $("fscore").textContent = score; $("frel").textContent = "last release " + version();
    $("quip").textContent = score > 0 && score >= best ? "✦ new high score. touch grass? nah, run it back." : quips[Math.floor(Math.random() * quips.length)];
    $("over").hidden = false; $("again").focus();
  }
  function start() { reset(); state = "play"; document.body.classList.add("playing"); $("start").hidden = true; $("over").hidden = true; cv.focus?.(); }
  function move(d) { if (state === "play") player = Math.max(0, Math.min(2, player + d)); }

  $("play").onclick = start; $("again").onclick = start;
  addEventListener("keydown", (e) => {
    if (["ArrowLeft", "a", "A"].includes(e.key)) { move(-1); e.preventDefault(); }
    else if (["ArrowRight", "d", "D"].includes(e.key)) { move(1); e.preventDefault(); }
    else if ((e.key === " " || e.key === "Enter") && state !== "play" && document.activeElement?.tagName !== "BUTTON") start();
    else if (e.key === "p" || e.key === "P") { if (state === "play") state = "paused"; else if (state === "paused") { state = "play"; last = performance.now(); } }
  });
  cv.addEventListener("pointerdown", (e) => move(e.clientX < W / 2 ? -1 : 1));
  document.addEventListener("visibilitychange", () => { if (document.hidden && state === "play") state = "paused"; });
  reset(); requestAnimationFrame(frame);
})();
</script>
</body>
</html>
