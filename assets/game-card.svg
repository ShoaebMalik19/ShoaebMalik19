<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160" role="img" aria-label="Commit Runner: a small browser game. Dodge bugs, collect commits. Click to play.">
<defs>
  <clipPath id="scene"><rect x="210" y="0" width="310" height="160" rx="0"/></clipPath>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0d12"/><stop offset="1" stop-color="#1a1030"/></linearGradient>
  <radialGradient id="sun" cx="50%" cy="100%" r="60%"><stop offset="0" stop-color="#f472b6" stop-opacity=".8"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
  <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a0d12"/><stop offset=".3" stop-color="#0a0d12" stop-opacity="0"/></linearGradient>
  <style>
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
    .sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .fan line{stroke:#5eead4;stroke-opacity:.22;stroke-width:1}
    .rows line{stroke:#f472b6;stroke-opacity:.35;stroke-width:1}
    .rows{animation:rows .9s linear infinite}
    @keyframes rows{from{transform:translateY(0)}to{transform:translateY(9px)}}
    .ship{animation:ship 4.8s ease-in-out infinite}
    .tilt{transform-box:fill-box;transform-origin:center;animation:tilt 4.8s ease-in-out infinite}
    .flame{transform-box:fill-box;transform-origin:top;animation:flame .18s ease-in-out infinite alternate}
    @keyframes flame{from{transform:scaleY(.6)}to{transform:scaleY(1.2)}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
    @keyframes o0{0%{transform:translate(365px,46px) scale(.08);opacity:0}6%{opacity:1}50%{transform:translate(285px,126px) scale(1);opacity:1}58%{transform:translate(273px,174px) scale(1.15);opacity:1}59%,100%{opacity:0;transform:translate(285px,180px) scale(1.15)}}.o0{animation:o0 4.8s cubic-bezier(.55,0,.9,.6) -0.40s infinite}@keyframes o1{0%{transform:translate(365px,46px) scale(.08);opacity:0}6%{opacity:1}50%{transform:translate(365px,126px) scale(1);opacity:1}52%{transform:translate(365px,126px) scale(1.5);opacity:0}100%{opacity:0;transform:translate(365px,126px) scale(1.5)}}.o1{animation:o1 4.8s cubic-bezier(.55,0,.9,.6) 0.80s infinite}@keyframes o2{0%{transform:translate(365px,46px) scale(.08);opacity:0}6%{opacity:1}50%{transform:translate(445px,126px) scale(1);opacity:1}58%{transform:translate(457px,174px) scale(1.15);opacity:1}59%,100%{opacity:0;transform:translate(445px,180px) scale(1.15)}}.o2{animation:o2 4.8s cubic-bezier(.55,0,.9,.6) 2.00s infinite}@keyframes o3{0%{transform:translate(365px,46px) scale(.08);opacity:0}6%{opacity:1}50%{transform:translate(285px,126px) scale(1);opacity:1}52%{transform:translate(285px,126px) scale(1.5);opacity:0}100%{opacity:0;transform:translate(285px,126px) scale(1.5)}}.o3{animation:o3 4.8s cubic-bezier(.55,0,.9,.6) -1.60s infinite}@keyframes ship{0%,26.0%{transform:translateX(-80px)}33.3%,75.0%{transform:translateX(0px)}82.3%,100%{transform:translateX(-80px)}}@keyframes tilt{0%,26.0%,33.3%,75.0%,82.3%,100%{transform:rotate(0)}29.6%{transform:rotate(14deg)}78.8%{transform:rotate(-14deg)}}@keyframes f0{0%,66.3%,74.0%,100%{opacity:0;transform:scale(.6)}66.7%{opacity:.9;transform:scale(1)}}.f0{transform-box:fill-box;transform-origin:center;animation:f0 4.8s linear infinite}@keyframes f1{0%,16.3%,24.0%,100%{opacity:0;transform:scale(.6)}16.7%{opacity:.9;transform:scale(1)}}.f1{transform-box:fill-box;transform-origin:center;animation:f1 4.8s linear infinite}
  </style>
</defs>
<rect width="520" height="160" rx="12" fill="#0a0d12"/>
<g clip-path="url(#scene)">
  <rect x="210" width="310" height="160" fill="url(#sky)"/>
  <ellipse cx="365" cy="46" rx="70" ry="30" fill="url(#sun)"/>
  <rect x="210" y="46" width="310" height="114" fill="#0a0d12"/>
  <g class="fan"><line x1="329" y1="46" x2="-115" y2="160"/><line x1="335" y1="46" x2="-35" y2="160"/><line x1="341" y1="46" x2="45" y2="160"/><line x1="347" y1="46" x2="125" y2="160"/><line x1="353" y1="46" x2="205" y2="160"/><line x1="359" y1="46" x2="285" y2="160"/><line x1="365" y1="46" x2="365" y2="160"/><line x1="371" y1="46" x2="445" y2="160"/><line x1="377" y1="46" x2="525" y2="160"/><line x1="383" y1="46" x2="605" y2="160"/><line x1="389" y1="46" x2="685" y2="160"/><line x1="395" y1="46" x2="765" y2="160"/><line x1="401" y1="46" x2="845" y2="160"/></g>
  <g class="rows"><line x1="210" y1="46.0" x2="520" y2="46.0"/><line x1="210" y1="48.3" x2="520" y2="48.3"/><line x1="210" y1="55.3" x2="520" y2="55.3"/><line x1="210" y1="66.9" x2="520" y2="66.9"/><line x1="210" y1="83.2" x2="520" y2="83.2"/><line x1="210" y1="104.2" x2="520" y2="104.2"/><line x1="210" y1="129.8" x2="520" y2="129.8"/><line x1="210" y1="160.0" x2="520" y2="160.0"/></g>
  <rect x="210" y="46" width="310" height="114" fill="url(#fog)"/>
  <line x1="210" y1="46" x2="520" y2="46" stroke="#f472b6" stroke-opacity=".7"/>
  <g class="o0"><path d="M-4 -7 L-7 -11 M4 -7 L7 -11" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round"/><ellipse rx="7" ry="8" fill="#f472b6"/><path d="M-7 -1 H7 M-7 3 H7" stroke="#0a0d12" stroke-width="1.2"/></g><g class="o1"><circle r="7" fill="#0a0d12" stroke="#5eead4" stroke-width="2.4"/><circle r="2.6" fill="#5eead4"/></g><g class="o2"><path d="M-4 -7 L-7 -11 M4 -7 L7 -11" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round"/><ellipse rx="7" ry="8" fill="#f472b6"/><path d="M-7 -1 H7 M-7 3 H7" stroke="#0a0d12" stroke-width="1.2"/></g><g class="o3"><circle r="7" fill="#0a0d12" stroke="#5eead4" stroke-width="2.4"/><circle r="2.6" fill="#5eead4"/></g><circle class="f0" cx="365" cy="126" r="16" fill="none" stroke="#5eead4" stroke-width="1.5"/><circle class="f1" cx="285" cy="126" r="16" fill="none" stroke="#5eead4" stroke-width="1.5"/>
  <g class="ship" transform="translate(0 0)"><g transform="translate(365 132)"><g class="tilt">
    <rect class="flame" x="-3.5" y="5" width="7" height="8" rx="3" fill="#f472b6"/>
    <path d="M0 -12 L13 7 L0 3 L-13 7 Z" fill="#5eead4"/>
  </g></g></g>
</g>
<line x1="210" y1="14" x2="210" y2="146" stroke="#ffffff" stroke-opacity=".08"/>

<text x="24" y="44" class="mono" font-size="11" fill="#5eead4" letter-spacing="2">SIDE QUEST</text>
<text x="24" y="72" class="sans" font-size="22" font-weight="700" fill="#f3f5f7">Commit Runner</text>
<text x="24" y="94" class="sans" font-size="13" fill="#9aa4b2">Dodge the bugs. Ship the commits.</text>
<g class="pulse">
  <rect x="24" y="110" width="118" height="28" rx="14" fill="#5eead4"/>
  <text x="83" y="128.5" text-anchor="middle" class="sans" font-size="12.5" font-weight="700" fill="#0a0d12">▶  Play in browser</text>
</g>
<rect x=".5" y=".5" width="519" height="159" rx="11.5" fill="none" stroke="#ffffff" stroke-opacity=".1"/>
</svg>
